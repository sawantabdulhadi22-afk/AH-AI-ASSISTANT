
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AH-AI-ASSISTANT | Voice</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at center, #102d48 0%, #071321 45%, #030811 100%);
  color: #eafaff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 22px 7%;
}

.logo {
  color: #58ddff;
  letter-spacing: 3px;
  font-size: 15px;
  font-weight: bold;
}

.status {
  color: #75eaff;
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  min-height: calc(100vh - 80px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

.heading {
  color: #91dff5;
  font-size: 12px;
  letter-spacing: 5px;
  margin-bottom: 12px;
}

h1 {
  font-size: clamp(27px, 5vw, 42px);
  margin-bottom: 10px;
}

.subtitle {
  color: #8ba9bd;
  font-size: 14px;
}

.orb-area {
  position: relative;
  width: min(76vw, 330px);
  height: min(76vw, 330px);
  display: grid;
  place-items: center;
  margin: 35px auto 25px;
}

.ring {
  position: absolute;
  border: 1px solid #32cfff55;
  border-radius: 50%;
  animation: rotate 12s linear infinite;
}

.ring.one {
  width: 100%;
  height: 100%;
  border-style: dashed;
}

.ring.two {
  width: 83%;
  height: 83%;
  border-color: #4bdfff99;
  animation-direction: reverse;
  animation-duration: 8s;
}

.ring.three {
  width: 68%;
  height: 68%;
  border-style: dotted;
  animation-duration: 18s;
}

.orb {
  width: 49%;
  height: 49%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #e9ffff, #55dfff 16%, #0878ba 48%, #061e48 78%);
  box-shadow:
    0 0 25px #37d7ff,
    0 0 65px #087bdc,
    inset 0 0 25px #c6faff;
  animation: breathe 3s ease-in-out infinite;
  transition: .3s;
}

.orb.listening {
  animation: listen .75s ease-in-out infinite alternate;
  box-shadow: 0 0 40px #42eaff, 0 0 110px #08b8ff;
}

.orb.processing {
  animation: process 1s linear infinite;
  filter: hue-rotate(45deg);
}

.orb.speaking {
  animation: speak .4s ease-in-out infinite alternate;
  box-shadow: 0 0 45px #67f5ff, 0 0 120px #009dff;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes breathe {
  50% { transform: scale(1.08); }
}

@keyframes listen {
  to { transform: scale(1.22); }
}

@keyframes process {
  to { transform: rotate(360deg) scale(1.08); }
}

@keyframes speak {
  to { transform: scale(1.16); }
}

#state {
  color: #6de7ff;
  font-size: 13px;
  letter-spacing: 3px;
  min-height: 20px;
  margin-bottom: 15px;
}

.visualizer {
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-bottom: 24px;
}

.visualizer span {
  display: block;
  width: 4px;
  height: 8px;
  border-radius: 10px;
  background: #48dfff;
  transition: height .08s;
}

.controls {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  border: 1px solid #36cfff88;
  background: #0b2941;
  color: white;
  border-radius: 30px;
  padding: 14px 22px;
  cursor: pointer;
  font-size: 13px;
  transition: .2s;
}

button:hover {
  background: #105078;
  box-shadow: 0 0 18px #28cfff55;
}

button.primary {
  background: linear-gradient(100deg, #087eae, #16b9db);
  color: #03121e;
  font-weight: bold;
  border: none;
  min-width: 150px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.chat {
  width: min(92vw, 550px);
  margin-top: 35px;
  background: #0a1929cc;
  border: 1px solid #25465e;
  border-radius: 16px;
  padding: 17px;
  text-align: left;
}

.chat h3 {
  font-size: 13px;
  color: #5ddfff;
  margin-bottom: 12px;
}

#messages {
  max-height: 180px;
  overflow-y: auto;
  margin-bottom: 12px;
  font-size: 13px;
  line-height: 1.6;
}

.message {
  padding: 9px 11px;
  margin: 7px 0;
  border-radius: 9px;
  background: #132b40;
  overflow-wrap: anywhere;
}

.message.user {
  border-left: 3px solid #38d9ff;
}

.message.ai {
  border-left: 3px solid #8d8bff;
}

.input-row {
  display: flex;
  gap: 8px;
}

input {
  min-width: 0;
  flex: 1;
  background: #061321;
  border: 1px solid #31516b;
  border-radius: 9px;
  padding: 12px;
  color: white;
  outline: none;
}

.input-row button {
  padding: 10px 16px;
}

.back {
  margin-top: 25px;
  color: #5ddfff;
  text-decoration: none;
  font-size: 13px;
}

footer {
  color: #607e95;
  font-size: 11px;
  margin: 20px 0;
}

@media(max-width: 450px) {
  header { padding: 18px; }
  .controls { gap: 8px; }
  button { padding: 12px 16px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">AH-AI-ASSISTANT</div>
  <div class="status" id="connection">● SYSTEM READY</div>
</header>

<main>
  <div class="heading">PERSONAL AI INTERFACE</div>
  <h1>How can I help you?</h1>
  <p class="subtitle">Your intelligent voice assistant</p>

  <div class="orb-area">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="ring three"></div>
    <div class="orb" id="orb"></div>
  </div>

  <div id="state">SYSTEM STANDBY</div>

  <div class="visualizer" id="visualizer">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span>
  </div>

  <div class="controls">
    <button class="primary" id="micButton" onclick="toggleListening()">
      🎙 Start Listening
    </button>
    <button onclick="stopSpeaking()">■ Stop Voice</button>
  </div>

  <section class="chat">
    <h3>CONVERSATION</h3>
    <div id="messages">
      <div class="message ai">
        AH-AI-ASSISTANT online. How may I help you?
      </div>
    </div>

    <div class="input-row">
      <input id="textInput" placeholder="Type your message..."
        onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </section>

  <a class="back" href="/">← Back to main assistant</a>
  <footer>AH-AI-ASSISTANT • VOICE INTERFACE</footer>
</main>

<script>
const orb = document.getElementById("orb");
const stateText = document.getElementById("state");
const micButton = document.getElementById("micButton");
const messages = document.getElementById("messages");
const connection = document.getElementById("connection");

let recognition = null;
let listening = false;
let audioContext = null;
let analyser = null;
let microphoneStream = null;
let visualFrame = null;
let history = [];

function setState(state, text) {
  orb.className = "orb";
  if (state !== "idle") orb.classList.add(state);
  stateText.textContent = text;
}

function addMessage(text, who) {
  const item = document.createElement("div");
  item.className = "message " + who;
  item.textContent = (who === "user" ? "You: " : "AH-AI: ") + text;
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
}

function startVisualizer() {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      microphoneStream = stream;
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      audioContext = new AudioContextClass();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;

      audioContext.createMediaStreamSource(stream)
        .connect(analyser);

      const bars = document.querySelectorAll(".visualizer span");
      const data = new Uint8Array(analyser.frequencyBinCount);

      function draw() {
        if (!analyser) return;
        analyser.getByteFrequencyData(data);

        bars.forEach((bar, index) => {
          const value = data[index] || 0;
          bar.style.height = (5 + value / 3) + "px";
        });

        visualFrame = requestAnimationFrame(draw);
      }

      draw();
    })
    .catch(() => {
      stateText.textContent = "MICROPHONE VISUALIZER UNAVAILABLE";
    });
}

function stopVisualizer() {
  if (visualFrame) cancelAnimationFrame(visualFrame);
  if (microphoneStream) {
    microphoneStream.getTracks().forEach(track => track.stop());
  }
  if (audioContext) audioContext.close();

  microphoneStream = null;
  audioContext = null;
  analyser = null;

  document.querySelectorAll(".visualizer span").forEach(bar => {
    bar.style.height = "8px";
  });
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "en-IN";
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  utterance.onstart = () => setState("speaking", "AH-AI SPEAKING");
  utterance.onend = () => setState("idle", "SYSTEM STANDBY");
  utterance.onerror = () => setState("idle", "SYSTEM STANDBY");

  speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  speechSynthesis.cancel();
  setState("idle", "VOICE STOPPED");
}

function setupRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Speech recognition is not supported in this browser. Try Chrome.");
    return null;
  }

  const instance = new SpeechRecognition();
  instance.lang = "en-IN";
  instance.continuous = false;
  instance.interimResults = false;

  instance.onstart = () => {
    listening = true;
    micButton.textContent = "■ Stop Listening";
    setState("listening", "LISTENING...");
    startVisualizer();
  };

  instance.onresult = event => {
    const transcript = event.results[0][0].transcript;
    document.getElementById("textInput").value = transcript;
    addMessage(transcript, "user");
    askAI(transcript);
  };

  instance.onerror = event => {
    setState("idle", "MICROPHONE: " + event.error.toUpperCase());
  };

  instance.onend = () => {
    listening = false;
    micButton.textContent = "🎙 Start Listening";
    stopVisualizer();
    if (!speechSynthesis.speaking) {
      setState("idle", "SYSTEM STANDBY");
    }
  };

  return instance;
}

function toggleListening() {
  if (listening && recognition) {
    recognition.stop();
    return;
  }

  if (!recognition) recognition = setupRecognition();
  if (!recognition) return;

  try {
    recognition.start();
  } catch (error) {
    setState("idle", "MICROPHONE NOT READY");
  }
}

async function askAI(message) {
  setState("processing", "PROCESSING YOUR REQUEST...");
  connection.textContent = "● CONNECTING TO AI";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        history
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI server error");
    }

    const reply = data.reply || data.message || data.answer;

    if (!reply) throw new Error("No reply received from AI");

    history.push(
      { role: "user", content: message },
      { role: "assistant", content: reply }
    );

    if (history.length > 20) history = history.slice(-20);

    addMessage(reply, "ai");
    connection.textContent = "● AI CONNECTED";
    speak(reply);

  } catch (error) {
    connection.textContent = "● CONNECTION ERROR";
    addMessage("I could not connect to the AI server. " +
      error.message, "ai");
    setState("idle", "CONNECTION ERROR");
  }
}

function sendMessage() {
  const input = document.getElementById("textInput");
  const message = input.value.trim();

  if (!message) return;

  input.value = "";
  addMessage(message, "user");
  askAI(message);
}

window.addEventListener("beforeunload", () => {
  stopVisualizer();
  speechSynthesis.cancel();
});
</script>

</body>
</html>
